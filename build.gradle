plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.42-beta'
}

version = "${mod_version}+${minecraft_version}"
group = maven_group

base {
    archivesName = archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()

    maven {
        name = "NeoForge"
        url = "https://maven.neoforged.net/releases"
    }

    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
    }

    maven {
        name = "WispForest"
        url = "https://maven.wispforest.io/releases/"
    }

    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }

    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
    }

    maven {
        name = "Sinytra"
        url "https://maven.su5ed.dev/releases"
    }
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = "2024.11.17"
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Curios API
//    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
//    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // OWO-lib for NeoForge
    implementation "io.wispforest:owo-lib-neoforge:${owo_version}"

    // Required runtime libraries for owo-lib on 1.21.1
    runtimeOnly "blue.endless:jankson:1.2.2"
    runtimeOnly "io.wispforest:endec:0.1.12"
    runtimeOnly "io.wispforest.endec:netty:0.1.6"
    runtimeOnly "io.wispforest.endec:gson:0.1.7"
    runtimeOnly "io.wispforest.endec:jankson:0.1.7"

    // REI (Roughly Enough Items)
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"

    // REI dependencies
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"

    implementation "io.wispforest:accessories-neoforge:${accessories_version}"

    annotationProcessor "io.wispforest:owo-lib-neoforge:${owo_version}"
}

// Add annotation processor generated sources to IDEA
sourceSets.main.java.srcDir file("${buildDir}/generated/sources/annotationProcessor/java/main")

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: "[${minecraft_version},1.22)",
        neoforge_version       : neoforge_version,
        neoforge_version_range : "[21.1,)",
        loader_version_range   : "[4,)",
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : version,
        mod_authors            : mod_authors,
        curios_version_range   : "[9.0,)",
        owo_version_range      : "[0.12,)"
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }

    manifest {
        attributes([
            'Specification-Title'     : mod_name,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : mod_name,
            'Implementation-Version'  : version,
            'Implementation-Vendor'   : mod_authors
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
